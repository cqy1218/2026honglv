name: 自动更新比赛成绩

run-name: 自动更新成绩 · ${{ github.event_name }}

on:
  # 手动运行
  workflow_dispatch:

  # 每10分钟自动运行一次
  # 使用 03/13/23/33/43/53 分，尽量避开 GitHub 高负载时段
  schedule:
    - cron: "3/5 * * * *"


# 防止两个任务同时修改仓库
concurrency:
  group: competition-score-update
  cancel-in-progress: true


permissions:
  contents: write


jobs:
  update-scores:

    runs-on: ubuntu-latest

    steps:

      - name: Show trigger information
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "UTC time:"
          date -u


      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Sync latest main
        run: |
          git pull --rebase origin main


      - name: Fetch scores
        env:
          WOCZX_COOKIE: ${{ secrets.WOCZX_COOKIE }}
          WOCZX_AUTHORIZATION: ${{ secrets.WOCZX_AUTHORIZATION }}
        run: |
          python fetch_scores.py


      - name: Check changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain README.md data/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "比赛成绩发生变化，需要提交。"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "比赛成绩没有变化，无需提交。"
          fi


      - name: Commit updated scores
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md data/

          git commit -m "Update competition scores"

          git pull --rebase origin main

          git push origin HEAD:main
