name: 自动更新比赛成绩

on:
  # 支持在 GitHub Actions 页面手动运行
  workflow_dispatch:

  # 每 10 分钟自动检查一次
  schedule:
    - cron: "*/10 * * * *"
      timezone: "Asia/Shanghai"


# 防止两个自动任务同时运行、同时 push
concurrency:
  group: competition-score-update
  cancel-in-progress: true


# 允许 GitHub Actions 自动修改仓库文件
permissions:
  contents: write


jobs:
  update-scores:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. 获取完整仓库
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # 2. 配置 Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # 3. 安装依赖
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 4. 先同步一次远程 main
      # 尽量避免本次 Action 基于旧版本运行
      # ======================================================

      - name: Sync latest main
        run: |
          git pull --rebase origin main


      # ======================================================
      # 5. 自动抓取成绩、读取 Excel、生成 README / CSV / JSON
      # ======================================================

      - name: Fetch scores
        env:
          WOCZX_COOKIE: ${{ secrets.WOCZX_COOKIE }}
          WOCZX_AUTHORIZATION: ${{ secrets.WOCZX_AUTHORIZATION }}
        run: |
          python fetch_scores.py


      # ======================================================
      # 6. 检查数据是否发生变化
      # ======================================================

      - name: Check changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain README.md data/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "比赛成绩发生变化，需要提交。"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "比赛成绩没有变化，无需提交。"
          fi


      # ======================================================
      # 7. 提交并推送最新成绩
      # ======================================================

      - name: Commit updated scores
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md data/

          git commit -m "Update competition scores"

          # 再次获取远程最新版本
          # 防止脚本运行期间刚好有人向 main 推送了新提交
          git pull --rebase origin main

          git push origin HEAD:main